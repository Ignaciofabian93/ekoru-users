name: 'ekoru-users-prod'

services:
  ekoru-users:
    image: ekoru-users:prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # docker stop: a small init passes SIGTERM to the app, which finishes its
    # requests and jobs in progress. Docker kills it only after 30 seconds.
    init: true
    stop_grace_period: 30s
    container_name: ekoru-users
    env_file:
      - .env.prod
    networks:
      - ekoru-network
    deploy:
      resources:
        limits:
          cpus: '2.0' # Maximum 2 CPU cores (production environment)
          memory: 1G # Maximum 1GB RAM (production environment)
        reservations:
          cpus: '0.5' # Minimum 0.5 CPU cores reserved
          memory: 512M # Minimum 512MB RAM reserved
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:4101/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ekoru-network:
    external: true
